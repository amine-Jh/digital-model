# Next.js on Netlify — OpenNext adapter is applied automatically (do not pin
# @netlify/plugin-nextjs unless you need a specific version).

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # NEXT_PUBLIC_* values are inlined into the browser bundle and edge middleware.
  # If they are flagged as secrets in the Netlify UI, scanning fails the deploy.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
  SECRETS_SCAN_OMIT_PATHS = ".next,.netlify,node_modules"
